<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="JEENI AI - High Performance Intelligent Learning Assistant">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JEENI">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JEENI AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    flt-glass-pane, flutter-view {
      background-color: #000000 !important;
    }
  </style>
  <script>
    if (window.location.pathname.startsWith('/app/')) {
      var base = document.querySelector('base');
      if (base) base.href = '/app/';
    } else {
      var base = document.querySelector('base');
      if (base) base.href = '/';
    }
  </script>
</head>
<body style="background-color: #000000; margin: 0; padding: 0;">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=hero_v1" async></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="JEENI AI - High Performance Intelligent Learning Assistant">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JEENI">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JEENI AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    flt-glass-pane, flutter-view {
      background-color: #000000 !important;
    }

    #jeeni-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }

    .jeeni-title {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 7px;
      color: #ffffff;
      margin-bottom: 24px;
      text-transform: uppercase;
      font-family: Georgia, 'Times New Roman', Times, serif;
    }

    .jeeni-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color: #000000;">
  <div id="jeeni-loader">
    <div class="jeeni-title">JEENI</div>
    <div class="jeeni-spinner"></div>
  </div>

  <script>
    // Fade out loader as soon as Flutter renders first frame
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('jeeni-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });

    // Safety fallback: if flutter-first-frame event is not caught, hide loader after 5s
    setTimeout(function() {
      var loader = document.getElementById('jeeni-loader');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }, 5000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
